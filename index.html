<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Class 9 maths formulas with pictures: Coordinate Geometry, Quadrilaterals, Surface Area and Volume, Sequences and Series.">
<title>Maths</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#11142a">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maths">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lexend:wght@300;400;600&family=STIX+Two+Text:ital,wght@0,500;1,500;1,600&display=swap">
<style>
/* Layout: one calm column. Night-study look: deep indigo, soft glows, a pastel hue per shape. */
:root{
  /* single look: night study (deep indigo, pastel accents) */
  --bg:#11142a; --bg-glow1:rgba(140,110,255,.22); --bg-glow2:rgba(80,210,190,.12); --dots:rgba(200,210,255,.05);
  --card:#1a1e3c; --card-2:#20254a; --line:#2c325e; --shadow:0 14px 34px -20px rgba(0,0,0,.8);
  --ink:#e9ebff; --muted:#a2a8d0;
  --accent:#a48bff; --accent-2:#ff9cc6; --on-accent:#14172e;
  --hl:#f7c96a; --vol:#5cd6c5; --face:#343b6c; --hole:#11142a;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  --hue:#a48bff;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;font-weight:400;
  background-color:var(--bg);
  background-image:
    radial-gradient(60rem 30rem at 0% -10%, var(--bg-glow1), transparent 60%),
    radial-gradient(40rem 26rem at 110% 20%, var(--bg-glow2), transparent 60%),
    radial-gradient(var(--dots) 1px, transparent 1.4px);
  background-size:auto,auto,20px 20px;background-attachment:fixed,fixed,scroll}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding-block:22px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance}
.eyebrow{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--hue);font-weight:600}
.m{font-family:var(--font-math);font-style:italic;font-weight:500}

/* Header */
.chapter{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chapter h1{font-size:clamp(2.4rem,9vw,3.2rem);font-weight:800;letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.chapter p{margin:0;color:var(--muted)}
.install{all:unset;cursor:pointer;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:var(--on-accent);
  font-weight:600;font-size:.88rem;border-radius:999px;padding:8px 16px;box-shadow:0 6px 18px -8px var(--accent)}
.install:focus-visible{outline:3px solid var(--vol);outline-offset:2px}

/* Chapter box */
.chbar{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:auto 1fr auto;
  grid-template-areas:"no name chev" "no meta chev";align-items:center;column-gap:14px;
  border:2px solid transparent;border-radius:20px;padding:14px 16px;margin-bottom:16px;
  background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--accent),var(--vol)) border-box;
  box-shadow:var(--shadow);transition:transform .2s ease}
.chbar:hover{transform:translateY(-2px)}
.chbar:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px}
.chno{grid-area:no;display:flex;flex-direction:column;align-items:center;justify-content:center;width:60px;height:60px;border-radius:16px;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));color:var(--on-accent);font-family:var(--font-display);line-height:1;
  box-shadow:0 8px 20px -10px var(--accent)}
.chno small{font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.chno b{font-size:1.65rem;font-weight:800}
.chname{grid-area:name;font-family:var(--font-display);font-weight:700;font-size:clamp(1.25rem,5vw,1.65rem);line-height:1.1;min-width:0;align-self:end}
.chmeta{grid-area:meta;font-size:.84rem;color:var(--muted);align-self:start;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.chmeta i{font-style:normal;background:color-mix(in srgb,var(--vol) 18%,transparent);color:var(--ink);border-radius:999px;padding:1px 9px;font-weight:600;font-size:.72rem}
.chev{grid-area:chev;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card-2);color:var(--ink);font-size:.72rem;transition:transform .25s ease}
.chbar[aria-expanded="true"] .chev{transform:rotate(180deg);background:var(--accent);color:var(--on-accent)}
.hint{margin:0 0 12px;color:var(--muted);font-size:.92rem}

/* Shape cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:800px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{all:unset;box-sizing:border-box;cursor:pointer;border-radius:18px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;
  background:color-mix(in srgb,var(--hue) 9%,var(--card));border:1px solid color-mix(in srgb,var(--hue) 28%,var(--line));
  transition:transform .2s ease,box-shadow .2s ease;animation:rise .45s ease both;animation-delay:calc(var(--i,0) * 35ms)}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 28px -16px var(--hue)}
.card:focus-visible{outline:3px solid var(--hue);outline-offset:2px}
.card svg{width:100%;height:auto;display:block}
.card .num{align-self:flex-start;font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--hue);
  background:color-mix(in srgb,var(--hue) 16%,transparent);border-radius:999px;padding:1px 8px}
.card h3{font-size:1.15rem;font-weight:700}
.card .chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.chip{font-size:.66rem;font-weight:600;border-radius:999px;padding:1px 7px;color:var(--muted);background:var(--card-2)}
.card.rev{background:linear-gradient(150deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--on-accent);justify-content:space-between}
.card.rev .num{color:var(--on-accent);background:rgba(255,255,255,.22)}
.card.rev p{margin:0;font-size:.82rem;opacity:.85}
.rev-mark{font-family:var(--font-math);font-style:italic;font-size:1.6rem;line-height:1.25;padding:10px 2px}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap}
.tag{font-size:.62rem;font-weight:600;border-radius:999px;padding:1px 7px;white-space:nowrap}
.tag-class9{background:var(--hl);color:#2a2105}
.tag-basics{background:var(--card-2);color:var(--muted)}
.tag-tricky{background:color-mix(in srgb,var(--accent-2) 22%,transparent);color:var(--accent-2)}
.hint b{color:var(--ink);font-weight:600}
.card.rev.wide{grid-column:1/-1}
@media (min-width:620px) and (max-width:799px){.card.rev.wide{grid-column:auto}}
/* Ch 8 geometry marks */
.hs{stroke:var(--hl);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.hs2{stroke:var(--vol);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.tk{stroke:var(--accent-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none}
.diag{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:5 4;stroke-opacity:.6;fill:none}
.wg{fill:var(--hl);fill-opacity:.85;stroke:none}
.wg2{fill:var(--vol);fill-opacity:.85;stroke:none}
.ra{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-opacity:.8}
.ra.on{fill:var(--hl);fill-opacity:.85;stroke:none}
.tint{fill:var(--hl);fill-opacity:.2;stroke:none}
.tint2{fill:var(--vol);fill-opacity:.25;stroke:none}
.vx{fill:var(--ink);font-family:var(--font-body);font-weight:600;font-size:13px;text-anchor:middle}
.card .vx{font-size:13px}
.formula .eq.long{font-size:clamp(1.25rem,5.4vw,1.75rem);line-height:1.35;overflow-wrap:anywhere}
.explain{margin:0 0 6px}
.explain ol,.explain ul{margin:8px 0 0;padding-left:1.25em;display:flex;flex-direction:column;gap:4px}
.grid{margin-bottom:18px}
table.rev8{min-width:0}
table.rev8 td:first-child{width:34%}
table.rev8 td:first-child button{white-space:normal}
.rrow{padding:2px 0}
.rrow .f{font-family:var(--font-math);font-style:italic;font-size:1.02rem}
.rrow small{color:var(--muted);font-size:.72rem;white-space:nowrap}
/* Sequences and Series */
.bar{fill:var(--face);fill-opacity:.75;stroke:var(--ink);stroke-width:1.1;stroke-opacity:.7}
.bar.on{fill:var(--hl);fill-opacity:.88}
.bar.v{fill:var(--vol);fill-opacity:.85}
.dt{stroke:var(--ink);stroke-width:1;stroke-opacity:.5}
.dt.on{fill:var(--hl)} .dt.v{fill:var(--vol)}
.gl{stroke:#10233a;stroke-opacity:.35;stroke-width:1}
.vx.sm{font-size:11px;font-weight:400}
.vx.dark{fill:#10233a;font-weight:600}
.vx.big{font-size:20px}
.tag-ap{background:var(--vol);color:#0c2a26}
.tag-gp{background:var(--hl);color:#2a2105}
/* Ch 1 coordinates */
.gridl{stroke:var(--ink);stroke-opacity:.08;stroke-width:1}
.ax{stroke:var(--ink);stroke-opacity:.75;stroke-width:1.4}
.hyp{stroke:var(--accent-2);stroke-width:3.4;stroke-linecap:round;fill:none}
.mirror{stroke:var(--accent-2);stroke-width:2;stroke-dasharray:6 4;fill:none}
.pd{fill:var(--hl);stroke:var(--card);stroke-width:1.5}
.pd.v{fill:var(--vol)} .pd.k{fill:var(--accent-2)}
.c1{fill:var(--hl);fill-opacity:.12;stroke:var(--hl);stroke-width:2.4}
.c2{fill:var(--vol);fill-opacity:.12;stroke:var(--vol);stroke-width:2.4}
.vx.l,.lbl.l{text-anchor:start} .vx.r,.lbl.r{text-anchor:end}
.vx.num{font-family:var(--font-display);font-size:20px;font-weight:700;fill-opacity:.85}
.card.rev:not(.wide) .rev-mark{font-size:1.08rem;white-space:nowrap}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Detail */
.back{all:unset;cursor:pointer;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px;padding:6px 12px;margin-bottom:10px;
  background:var(--card);border:1px solid var(--line);border-radius:999px;font-size:.9rem}
.back:focus-visible{outline:2px solid var(--hue);outline-offset:3px}
.dhead{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.dhead h2{font-size:clamp(1.9rem,6.5vw,2.5rem);font-weight:800}
.dhead .vars{color:var(--muted);font-size:.92rem}

.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:5px;margin-bottom:14px}
.tab{all:unset;cursor:pointer;text-align:center;border-radius:14px;padding:9px 6px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;line-height:1.1;color:var(--muted);transition:background .2s,color .2s}
.tab small{display:block;font-family:var(--font-body);font-weight:400;font-size:.66rem;opacity:.8;margin-top:2px}
.tab[aria-selected="true"]{background:var(--hue);color:#14172e;box-shadow:0 8px 18px -10px var(--hue)}
.tab:focus-visible{outline:2px solid var(--hue);outline-offset:2px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.fig{display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:16px;padding:10px 6px;
  background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--hue) 14%,transparent),transparent 70%)}
.fig svg{width:100%;max-width:380px;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:13px;height:13px;border-radius:4px;display:inline-block}
.sw.on{background:var(--hl)} .sw.off{background:var(--face)} .sw.vol{background:var(--vol)}

.formula{border-radius:18px;padding:16px 12px;text-align:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--hue) 16%,var(--card-2)),var(--card-2));border:1px solid color-mix(in srgb,var(--hue) 30%,var(--line))}
.formula .name{font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--hue)}
.formula .eq{font-family:var(--font-math);font-size:clamp(1.8rem,7vw,2.5rem);font-style:italic;font-weight:500;margin-top:4px;overflow-x:auto}
.formula .eq .lhs{font-style:normal;font-family:var(--font-display);font-weight:700;font-size:.72em;margin-right:.2em;color:var(--hue)}
.section h3{font-size:1.15rem;margin-bottom:4px}
.section p{margin:0 0 6px}
.example{background:color-mix(in srgb,var(--hl) 12%,var(--card));border:1px solid color-mix(in srgb,var(--hl) 45%,var(--line));border-radius:16px;padding:12px 14px}
.example h3{font-size:1.05rem;margin-bottom:6px}
.example ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:2px}
.example .ans{display:inline-block;font-weight:600;margin-top:8px;background:var(--hl);color:#2a2105;border-radius:999px;padding:2px 12px}
.note{font-size:.9rem;color:var(--muted);border-left:3px solid var(--accent-2);padding-left:10px}
.note b{color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.pager button{all:unset;cursor:pointer;font-weight:600;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.88rem}
.pager button:hover{border-color:var(--hue)}
.pager button:focus-visible{outline:2px solid var(--hue)}
.pager .sp{flex:1}

/* Revision table */
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--font-display);font-size:1rem;color:var(--accent)}
td.f{font-family:var(--font-math);font-style:italic;font-size:1.05rem;white-space:nowrap}
tr:last-child td{border-bottom:none}
td button{all:unset;cursor:pointer;font-weight:600;color:var(--ink)}
td button:hover{color:var(--accent)}

/* SVG diagrams */
.st{stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;fill:none}
.nost{stroke:none}
.f-off{fill:var(--face);fill-opacity:.6}
.f-on{fill:var(--hl);fill-opacity:.75}
.f-vol{fill:var(--vol);fill-opacity:.55}
.hole{fill:var(--hole)}
.eh{stroke:var(--ink);stroke-dasharray:4 4;stroke-opacity:.5;stroke-width:1.3;fill:none}
.dim{stroke:var(--accent-2);stroke-width:1.6;stroke-dasharray:5 3;fill:none}
.lbl{fill:var(--accent-2);font-family:var(--font-math);font-style:italic;font-weight:600;font-size:17px;text-anchor:middle}
.lbl.sm{font-size:12px;font-style:normal;font-family:var(--font-body)}
.dot{fill:var(--accent-2)}
.card .lbl{font-size:15px}

@media (prefers-reduced-motion:reduce){.card{animation:none;transition:none}.card:hover,.chbar:hover{transform:none}.chev,.tab{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ---------- SVG helpers ----------
const P = a => a.map(p => p.join(',')).join(' ');
const pg = (pts, cls) => `<polygon points="${P(pts)}" class="${cls}"/>`;
const ln = (a, b, cls) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="${cls}"/>`;
const tx = (x, y, t, cls='lbl') => `<text x="${x}" y="${y}" class="${cls}">${t}</text>`;
const pa = (d, cls) => `<path d="${d}" class="${cls}"/>`;
const el = (cx, cy, rx, ry, cls) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" class="${cls}"/>`;
const dot = (x, y) => `<circle cx="${x}" cy="${y}" r="2.6" class="dot"/>`;
const fc = (mode, counts) => mode === 'vol' ? 'f-vol' : (mode && counts.includes(mode)) ? 'f-on' : 'f-off';
const wrap = (inner, label) => `<svg viewBox="0 0 240 200" role="img" aria-label="${label}">${inner}</svg>`;

function box(m, A, B, C, D, dx, dy, labels) {
  const s = p => [p[0] + dx, p[1] + dy];
  const A2 = s(A), B2 = s(B), C2 = s(C), D2 = s(D);
  return pg([D, C, C2, D2], fc(m, ['tsa']) + ' nost') +
    pg([A2, B2, C2, D2], fc(m, ['lsa', 'tsa']) + ' nost') +
    pg([A, A2, D2, D], fc(m, ['lsa', 'tsa']) + ' nost') +
    ln(D2, A2, 'eh') + ln(D2, C2, 'eh') + ln(D2, D, 'eh') +
    pg([A, B, C, D], fc(m, ['lsa', 'tsa']) + ' st') +
    pg([B, B2, C2, C], fc(m, ['lsa', 'tsa']) + ' st') +
    pg([A, A2, B2, B], fc(m, ['tsa']) + ' st') + labels;
}

const DRAW = {
  cube: m => box(m, [60,75],[150,75],[150,165],[60,165], 45,-40,
    tx(105,186,'a') + tx(44,126,'a') + tx(184,156,'a')),
  cuboid: m => box(m, [35,85],[165,85],[165,165],[35,165], 40,-35,
    tx(100,186,'l') + tx(20,130,'h') + tx(196,158,'b')),
  cylinder: m =>
    el(120,160,60,16, fc(m,['tsa'])+' nost') + pa('M60,160 A60,16 0 0 1 180,160','eh') +
    pa('M60,50 L60,160 A60,16 0 0 0 180,160 L180,50 A60,16 0 0 1 60,50 Z', fc(m,['lsa','tsa'])+' st') +
    el(120,50,60,16, fc(m,['tsa'])+' st') +
    ln([120,50],[180,50],'dim') + dot(120,50) + tx(150,44,'r') +
    ln([200,50],[200,160],'dim') + tx(212,110,'h'),
  hollow: m =>
    pa('M55,160 A65,17 0 0 1 185,160 A65,17 0 0 1 55,160 Z M88,160 A32,8.5 0 0 0 152,160 A32,8.5 0 0 0 88,160 Z', fc(m,['tsa'])+' nost') +
    pa('M55,160 A65,17 0 0 1 185,160','eh') +
    pa('M88,50 L88,160 A32,8.5 0 0 0 152,160 L152,50 Z', (m==='vol' ? 'hole' : fc(m,['lsa','tsa']))+' nost') +
    ln([88,50],[88,160],'eh') + ln([152,50],[152,160],'eh') + pa('M88,160 A32,8.5 0 0 0 152,160','eh') +
    pa('M55,50 L55,160 A65,17 0 0 0 185,160 L185,50 A65,17 0 0 1 55,50 Z', fc(m,['lsa','tsa'])+' st') +
    pa('M55,50 A65,17 0 0 1 185,50 A65,17 0 0 1 55,50 Z M88,50 A32,8.5 0 0 0 152,50 A32,8.5 0 0 0 88,50 Z', fc(m,['tsa'])+' st') +
    `<path d="M88,50 A32,8.5 0 0 0 152,50 A32,8.5 0 0 0 88,50 Z" class="${m==='vol'?'hole':'hole'}" style="fill-opacity:.55"/>` +
    el(120,50,32,8.5,'st') +
    ln([120,50],[185,50],'dim') + ln([120,50],[88,50],'dim') + dot(120,50) +
    tx(198,55,'R') + tx(104,44,'r') +
    ln([36,50],[36,160],'dim') + tx(24,110,'h'),
  cone: m =>
    el(120,160,65,16, fc(m,['tsa'])+' nost') + pa('M55,160 A65,16 0 0 1 185,160','eh') +
    pa('M55,160 L120,28 L185,160 A65,16 0 0 1 55,160 Z', fc(m,['lsa','tsa'])+' st') +
    ln([120,28],[120,160],'dim') + ln([120,160],[185,160],'dim') + dot(120,160) +
    tx(128,112,'h') + tx(152,156,'r') + tx(166,90,'l'),
  sphere: m =>
    `<circle cx="120" cy="100" r="72" class="${fc(m,['tsa'])} st"/>` +
    pa('M48,100 A72,18 0 0 1 192,100','eh') + pa('M48,100 A72,18 0 0 0 192,100','st') +

// ---------- Ch 8 Quadrilaterals: geometry helpers ----------
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1]], sub: (a, b) => [a[0] - b[0], a[1] - b[1]],
  mul: (a, k) => [a[0] * k, a[1] * k], lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t],
  mid: (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2],
  unit: v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; },
  perp: v => [-v[1], v[0]]
};
const r1 = n => Math.round(n * 10) / 10;
const pt = p => p.map(r1);
function ticks(a, b, n, cls = 'tk', at = .5) {
  const m = V.lerp(a, b, at), u = V.unit(V.sub(b, a)), p = V.perp(u); let o = '';
  for (let i = 0; i < n; i++) { const c = V.add(m, V.mul(u, (i - (n - 1) / 2) * 5)); o += ln(pt(V.add(c, V.mul(p, 6))), pt(V.add(c, V.mul(p, -6))), cls); }
  return o;
}
function chev(a, b, n = 1, cls = 'tk', at = .5) {
  const m = V.lerp(a, b, at), u = V.unit(V.sub(b, a)), p = V.perp(u); let o = '';
  for (let i = 0; i < n; i++) {
    const c = V.add(m, V.mul(u, (i - (n - 1) / 2) * 6)), tip = V.add(c, V.mul(u, 3)), back = V.add(c, V.mul(u, -3));
    o += `<polyline points="${P([V.add(back, V.mul(p, 4.5)), tip, V.add(back, V.mul(p, -4.5))].map(pt))}" class="${cls}"/>`;
  }
  return o;
}
function wedge(O, P1, P2, r, cls) {
  const u1 = V.unit(V.sub(P1, O)), u2 = V.unit(V.sub(P2, O)), a = V.add(O, V.mul(u1, r)), b = V.add(O, V.mul(u2, r));
  const cr = u1[0] * u2[1] - u1[1] * u2[0];
  return `<path d="M${pt(O)} L${pt(a)} A${r},${r} 0 0 ${cr > 0 ? 1 : 0} ${pt(b)} Z" class="${cls}"/>`;
}
function rightA(O, P1, P2, s = 11, cls = 'ra') {
  const u1 = V.unit(V.sub(P1, O)), u2 = V.unit(V.sub(P2, O)), a = V.add(O, V.mul(u1, s)), c = V.add(O, V.mul(u2, s));
  return `<polygon points="${P([O, a, V.add(a, V.mul(u2, s)), c].map(pt))}" class="${cls}"/>`;
}
const corners = (Q, cls) => Q.map((p, i) => rightA(p, Q[(i + 1) % 4], Q[(i + 3) % 4], 11, cls)).join('');
const sides = Q => Q.map((p, i) => [p, Q[(i + 1) % 4]]);
const vlabel = (p, off, t) => `<text x="${r1(p[0] + off[0])}" y="${r1(p[1] + off[1] + 5)}" class="vx">${t}</text>`;
function names(Q, ns) {
  const G = Q.reduce((s, p) => V.add(s, V.mul(p, 1 / Q.length)), [0, 0]);
  return Q.map((p, i) => vlabel(p, V.mul(V.unit(V.sub(p, G)), 13), ns[i])).join('');
}
const qdot = p => `<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="2.8" class="dot"/>`;
const dotO = (O, off = [14, 2]) => qdot(O) + vlabel(O, off, 'O');

    let o = pg(Q, 'f-off');
    if (k === 'sides') o += sides(Q).map(([a, b]) => ln(a, b, 'hs') + ticks(a, b, 1)).join('') + corners(Q, 'ra on');
    if (k === 'diag') o += wedge(A, B, C, 24, 'wg2') + ln(A, C, 'hs') + ln(B, D, 'hs') + ticks(A, O, 1) + ticks(O, C, 1) + ticks(B, O, 1) + ticks(O, D, 1) + rightA(O, B, C, 10, 'ra on') + dotO(O, [14, 13]) + vlabel(A, [34, -10], '45°');
    if (!k) o += corners(Q, 'ra') + sides(Q).map(([a, b]) => ticks(a, b, 1)).join('');
    return o + pg(Q, 'st') + names(Q, ABCD);
  },
  trapezium: k => {
    const A = [28, 160], B = [212, 160], C = [160, 58], D = [80, 58], Q = [A, B, C, D];
    let o = pg(Q, 'f-off');
    if (k === 'parallel') o += ln(A, B, 'hs2') + ln(D, C, 'hs2') + chev(A, B) + chev(D, C) + wedge(A, B, D, 24, 'wg') + wedge(D, A, C, 18, 'wg');
    if (k === 'iso') o += ln(A, D, 'hs2') + ln(B, C, 'hs2') + ticks(A, D, 1) + ticks(B, C, 1) + chev(A, B) + chev(D, C) +
      wedge(A, B, D, 24, 'wg') + wedge(B, C, A, 24, 'wg') + wedge(C, D, B, 17, 'wg2') + wedge(D, A, C, 17, 'wg2');
    if (!k) o += chev(A, B) + chev(D, C);
    return o + pg(Q, 'st') + names(Q, ABCD);
  },
  midpoint: k => {
    const A = [120, 30], B = [28, 172], C = [212, 172], E = V.mid(A, B), F = V.mid(A, C), T = [A, B, C];
    let o = pg(T, 'f-off');
    if (k === 'thm') o += pg([A, E, F], 'tint') + ln(E, F, 'hs') + ln(B, C, 'hs2') + chev(E, F, 1, 'tk', .72) + chev(B, C, 1, 'tk', .72) +
      ticks(A, E, 1) + ticks(E, B, 1) + ticks(A, F, 2) + ticks(F, C, 2);
    if (k === 'conv') o += ln(E, F, 'hs') + chev(E, F, 1, 'tk', .72) + chev(B, C, 1, 'tk', .72) + ticks(A, E, 1) + ticks(E, B, 1) +
      ln(A, F, 'hs2') + ln(F, C, 'hs2') + ticks(A, F, 2) + ticks(F, C, 2);
    if (!k) o += ln(E, F, 'st') + ticks(A, E, 1) + ticks(E, B, 1) + ticks(A, F, 2) + ticks(F, C, 2);
    o += pg(T, 'st') + qdot(E) + qdot(F);
    return o + vlabel(A, [0, -13], 'A') + vlabel(B, [-9, 9], 'B') + vlabel(C, [9, 9], 'C') + vlabel(E, [-13, -2], 'E') + vlabel(F, [13, -2], 'F');
  },
  midquad: k => {
    if (k === 'special') {
      const A = [36, 165], B = [204, 165], C = [204, 45], D = [36, 45], Q = [A, B, C, D];
      const M = [V.mid(A, B), V.mid(B, C), V.mid(C, D), V.mid(D, A)];
      return pg(Q, 'f-off') + corners(Q, 'ra') + pg(M, 'tint2') + pg(M, 'hs2') + M.map((p, i) => ticks(p, M[(i + 1) % 4], 1)).join('') +
        pg(Q, 'st') + M.map(qdot).join('') + names(Q, ABCD);
    }
    const A = [34, 168], B = [196, 172], C = [214, 52], D = [64, 32], Q = [A, B, C, D];
    const Pm = V.mid(A, B), Qm = V.mid(B, C), R = V.mid(C, D), S = V.mid(D, A), M = [Pm, Qm, R, S];
    let o = pg(Q, 'f-off');
    if (k === 'any') o += ln(A, C, 'diag') + pg(M, 'tint2') + ln(Pm, Qm, 'hs') + ln(S, R, 'hs') + ln(Qm, R, 'hs2') + ln(Pm, S, 'hs2') +
      chev(Pm, Qm) + chev(S, R) + chev(A, C, 1, 'tk', .3);
    else o += pg(M, 'st');
    return o + pg(Q, 'st') + M.map(qdot).join('') + names(Q, ABCD) +
      vlabel(Pm, [0, 14], 'P') + vlabel(Qm, [13, 2], 'Q') + vlabel(R, [0, -14], 'R') + vlabel(S, [-13, 0], 'S');
  }
};

const cp = (ox, oy, u) => ({ P: (x, y) => [ox + x * u, oy - y * u] });
function plane(ox, oy, u, xr, yr, lab = true) {
  let s = '';
  for (let i = xr[0]; i <= xr[1]; i++) if (i) s += ln([ox + i * u, oy - yr[1] * u], [ox + i * u, oy - yr[0] * u], 'gridl');
  for (let j = yr[0]; j <= yr[1]; j++) if (j) s += ln([ox + xr[0] * u, oy - j * u], [ox + xr[1] * u, oy - j * u], 'gridl');
  s += ln([ox + xr[0] * u - 4, oy], [ox + xr[1] * u + 6, oy], 'ax') + ln([ox, oy - yr[0] * u + 4], [ox, oy - yr[1] * u - 6], 'ax');
  if (lab) s += txt(ox + xr[1] * u + 5, oy - 6, 'x', 'vx sm') + txt(ox + 9, oy - yr[1] * u - 3, 'y', 'vx sm');
  return s;
}

        txt(A[0] + 6, A[1] + 16, 'A (1, 1)', 'vx sm l') + txt(B[0] - 4, B[1] - 9, 'B (10, 7)', 'vx sm r') + txt(Pp[0] + 9, Pp[1] + 14, 'P (4, 3)', 'vx sm l') + txt(Q[0] + 9, Q[1] + 14, 'Q (7, 5)', 'vx sm l');
    }
    const S = P(1, 1), T = P(9, 7), M = P(5, 4);
    o += ln(S, T, 'hs') + ticks(S, M, 1) + ticks(M, T, 1) + (k ? ln([M[0], 176], M, 'diag') + ln([30, M[1]], M, 'diag') : '') + pdot(S) + pdot(T) + pdot(M, 'pd v');
    if (k) o += txt(S[0] + 6, S[1] + 16, 'S (1, 1)', 'vx sm l') + txt(T[0] - 6, T[1] - 9, 'T (9, 7)', 'vx sm r') + txt(M[0] + 9, M[1] + 14, 'M (5, 4)', 'vx sm l');
    return o;
  },
  collin: k => {
    const { P } = cp(74, 112, 10);
    let o = plane(74, 112, 10, [-5, 14], [-7, 9]);
    const M = P(-3, -4), A = P(0, 0), G = P(6, 8);
    o += ln(M, A, 'hs') + ln(A, G, 'hs2') + pdot(M) + pdot(A, 'pd k') + pdot(G, 'pd v');
    if (k) o += txt(M[0], M[1] + 19, 'M (−3, −4)', 'vx sm') + txt(A[0] + 8, A[1] + 12, 'A (0, 0)', 'vx sm l') + txt(G[0] + 8, G[1] + 4, 'G (6, 8)', 'vx sm l') +
      txt((M[0] + A[0]) / 2 - 7, (M[1] + A[1]) / 2, '5', 'lbl r') + txt((A[0] + G[0]) / 2 - 7, (A[1] + G[1]) / 2, '10', 'lbl r') + txt(176, 150, '5 + 10 = 15', 'lbl');
    return o;
  },
  circ: k => {
    if (k === 'two') {
      const A = [75, 107.5], B = [157.5, 63.5];
      return `<circle cx="${A[0]}" cy="${A[1]}" r="44" class="c1"/><circle cx="${B[0]}" cy="${B[1]}" r="55" class="c2"/>` + ln(A, B, 'hyp') + pdot(A) + pdot(B, 'pd v') +
        txt(A[0] - 8, A[1] + 4, 'A', 'vx sm r') + txt(B[0] + 8, B[1] + 4, 'B', 'vx sm l') + txt(124, 101, 'd = 170', 'lbl l') + txt(75, 170, 'r₁ = 80', 'vx sm') + txt(196, 140, 'r₂ = 100', 'vx sm');
    }
    const { P } = cp(120, 100, 10);
    let o = plane(120, 100, 10, [-10, 10], [-9, 9], false) + `<circle cx="120" cy="100" r="${r1(Math.sqrt(65) * 10)}" class="c1"/>`;
    const on = [[1, -8, 'A', 'l'], [-4, 7, 'B', 'l'], [-7, -4, 'C', 'r']];
    o += on.map(([x, y, n, s]) => pdot(P(x, y)) + (k ? txt(P(x, y)[0] + (s === 'l' ? 7 : -7), P(x, y)[1] + (y > 0 ? -3 : 12), n, 'vx sm ' + s) : '')).join('');
    o += pdot(P(-5, 6), 'pd v') + pdot(P(0, 9), 'pd k');
    if (k) o += txt(P(-5, 6)[0] - 7, P(-5, 6)[1] + 8, 'D', 'vx sm r') + txt(P(0, 9)[0] + 7, P(0, 9)[1] + 4, 'E', 'vx sm l') + ln([120, 100], P(1, -8), 'diag') + txt(138, 140, '√65', 'lbl l') + pdot([120, 100], 'pd k');
    return o;
  },
  sqr: k => {
    const { P } = cp(120, 100, 24);
    let o = plane(120, 100, 24, [-3, 3], [-3, 3]);
    const Q = [P(2, 1), P(-1, 2), P(-2, -1), P(1, -2)];
    o += pg(Q, 'tint2') + (k ? ln(Q[0], Q[2], 'hs') + ln(Q[1], Q[3], 'hs') + ticks(Q[0], Q[2], 2, 'tk', .3) + ticks(Q[1], Q[3], 2, 'tk', .3) : '') +
      pg(Q, 'hs2') + sides(Q).map(([a, b]) => ticks(a, b, 1)).join('') + Q.map(p => pdot(p, 'pd k')).join('');
    return o + (k ? names(Q, ['A', 'B', 'C', 'D']) : '');
  }
};

  const k = tabOf(s), t = s.tabs.find(x => x.k === k);
  const prev = items[idx - 1], next = items[idx + 1];
  app.style.setProperty('--hue', hueOf(idx));
  const eqLong = plain((t.lhs || '') + t.eq).length > 16;
  app.innerHTML = `
    <button class="back" data-go="${ch.id}">← Ch ${ch.no} ${ch.name}</button>

      <h2>${s.name}</h2>
      <div class="vars">${s.vars}</div>
    </header>
    ${s.tabs.length > 1 ? `<div class="tabs" role="tablist">
      ${s.tabs.map(x => `<button class="tab" role="tab" id="tab-${s.id}-${x.k}" aria-selected="${x.k === k}" data-tab="${x.k}">${x.short}<small>${x.full}</small></button>`).join('')}
    </div>` : ''}
    <section class="panel" ${s.tabs.length > 1 ? `role="tabpanel" aria-labelledby="tab-${s.id}-${k}"` : ''}>
      <div class="fig">
        ${wrap(s.fn(k), s.name + ' – ' + t.full)}
        <div class="legend">${ch.legend(k, s)}</div>
      </div>
      <div class="formula">
        <div class="name">${t.th ? `${t.th} · ` : ''}${t.full}</div>
        <div class="eq${eqLong ? ' long' : ''}">${t.lhs ? `<span class="lhs">${t.lhs} =</span> ` : ''}${t.eq}</div>
      </div>
      <div class="section">
        <h3>How it works</h3>
        <div class="explain">${t.explain}</div>
      </div>
      <div class="example">
        <h3>Example</h3>
        <p style="margin:0 0 4px"><b>Given:</b> ${t.ex.given}</p>
        <ol>${t.ex.steps.map(x => `<li>${x}</li>`).join('')}</ol>
        <div class="ans">${t.ex.ans}</div>
      </div>
      ${s.note ? `<div class="note">${s.note}</div>` : ''}
    </section>
    <nav class="pager">
      ${prev ? `<button data-go="${prev.id}">← ${prev.name}</button>` : '<span class="sp"></span>'}
      ${next ? `<button data-go="${next.id}">${next.name} →</button>` : `<button data-go="rev-${ch.id}">Quick Revision →</button>`}
    </nav>`;
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { state[s.id] = b.dataset.tab; detail(s); document.getElementById(`tab-${s.id}-${b.dataset.tab}`).focus(); });
}

function revision(ch) {
  app.style.removeProperty('--hue');
  app.innerHTML = `
    <button class="back" data-go="${ch.id}">← Ch ${ch.no} ${ch.name}</button>
    <header class="dhead">
      <span class="eyebrow">${ch.name}</span>
      <h2>Quick Revision</h2>
      <div class="vars">${ch.revSub}</div>
    </header>
    ${ch.rev(ch)}`;
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const s = ALL.find(x => x.id === id);
  const rc = CHAPTERS.find(c => 'rev-' + c.id === id) || (id === 'revision' ? CHAPTERS.find(c => c.id === 'ch14') : null);
  const ch = CHAPTERS.find(c => c.id === id);
  if (s) detail(s); else if (rc) revision(rc); else home(ch ? ch.id : null);
  window.scrollTo(0, 0);
}
app.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (!b) return;
  const id = b.dataset.go;
  if (('#' + id) === location.hash || (!id && !location.hash)) route();
  else location.hash = id;
});
window.addEventListener('hashchange', route);
route();

// Installable app: offline support + an Install button when the browser allows it
let installEvt = null;
const showInstall = () => { const b = document.getElementById('install'); if (b && installEvt) b.hidden = false; };
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall(); });
window.addEventListener('hashchange', showInstall);
document.addEventListener('click', e => {
  if (e.target.id !== 'install' || !installEvt) return;
  installEvt.prompt();
  installEvt.userChoice.finally(() => { installEvt = null; e.target.hidden = true; });
});
window.addEventListener('appinstalled', () => { installEvt = null; const b = document.getElementById('install'); if (b) b.hidden = true; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
