plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('VERSION_CODE') ?: '1') as int

android {
    namespace 'com.bhoomagopala.maths'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bhoomagopala.maths'
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    // One fixed key (from the repo's private secrets), so every new APK installs as an update.
    // Without the secrets, builds fall back to a throwaway debug key.
    def keyFile = file('../signing/maths.keystore')
    def keyPass = System.getenv('MATHS_KEY_PASSWORD') ?: ''
    signingConfigs {
        shared {
            storeFile keyFile
            storePassword keyPass
            keyAlias 'maths'
            keyPassword keyPass
        }
    }

    buildTypes {
        debug {
            if (keyFile.exists() && keyPass) signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
