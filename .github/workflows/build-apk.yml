name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the Maths web app inside the Android project
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json android/app/src/main/assets/
          cp -r icons android/app/src/main/assets/

      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon

      - name: Name it Maths.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Maths.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Maths-apk
          path: Maths.apk

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.${{ github.run_number }}
          name: Maths app v1.${{ github.run_number }}
          make_latest: true
          files: Maths.apk
          body: |
            Download **Maths.apk** below and open it on your Android phone.
            If Android asks, allow "Install unknown apps" for your browser or Files app.
